language: python
dist: jammy
python:
  - "3.11"
install:
  - pip install -r requirements.txt
  - pip install black==26.10.1 flake8==7.4.1 coverage coveralls
before_script:
  - python manage.py migrate
  - python manage.py collectstatic --noinput
script:
  - coverage run --source=nycfood,search,restaurants,accounts,community manage.py test
  - black --check .
  - flake8 .
after_success:
  - coveralls
deploy:
  provider: elasticbeanstalk
  access_key_id:
    secure: 
  secret_access_key:
    secure: 
  region: us-east-1
  app: nycfood
  env: nycfood-env
  bucket_name: elasticbeanstalk-us-east-1-322134621417
  edge: true
  on:
    branch: develop

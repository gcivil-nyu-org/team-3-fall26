name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==26.10.1 flake8==7.4.1 coverage

      - name: Migrate and collect static
        run: |
          python manage.py migrate
          python manage.py collectstatic --noinput

      - name: Test
        run: coverage run --source=nycfood,search,restaurants,accounts,community manage.py test

      - name: Format and lint
        run: |
          black --check .
          flake8 .

      - name: Convert coverage to LCOV
        if: success()
        run: coverage lcov -o coverage.lcov

      - name: Upload coverage
        if: success()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          format: lcov

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'gcivil-nyu-org/team-3-fall26'
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install EB CLI
        run: pip install awsebcli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::322134621417:role/github-nycfood-deploy
          aws-region: us-east-1

      - name: Deploy
        run: eb deploy nycfood-env
